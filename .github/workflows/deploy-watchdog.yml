# Deploy watchdog (owner's approval, 21 Oct 2026).
#
# A safety net for pushes to main that never reach Vercel. On 21 Oct 2026, the push of b984c87 (15:15:48 UTC) made
# no Vercel deployment: GitHub had an open incident, "Delays for Pull Requests and Webhook deliveries", from
# 14:52 UTC. Every other push that day deployed through the Git integration within about 2 minutes.
#
# Five minutes after a push, this checks GitHub's deployments for the pushed commit. Vercel records one for every
# build it starts (createDeployments is enabled on the project), so no Vercel token is needed. If there is none,
# and the commit is still the head of main, it calls the project's deploy hook, which builds the head of main.
# A newer push has its own watchdog run, and concurrency cancels the older one.
#
# Uses the repository secret VERCEL_DEPLOY_HOOK: the URL of the project's deploy hook (Vercel project settings →
# Git → Deploy Hooks).
#
# 29 Oct 2026 (owner's approval): Vercel's Ignored Build Step (scripts/vercel-ignore-build.sh) now skips a commit
# whose changes are all outside the site. Such a push may have no Vercel build, so before looking for one this
# compares the push (event.before to the pushed commit) with the same classifier (scripts/lib/site-change.sh); if
# every changed file is outside the site, the push counts as deployed and the hook is not called. Any doubt (no
# previous commit, a failed git read, an unknown file) falls through to the check below.
#
# Limits: the incident that caused this also slowed Actions, so this run may start late too. It still fires once
# Actions recovers, which is better than no deployment at all. It never calls the hook for a commit that already
# has a deployment, so it can't double-deploy.
name: Deploy watchdog

on:
  push:
    branches: [main]

concurrency:
  group: deploy-watchdog
  cancel-in-progress: true

permissions:
  deployments: read
  contents: read

jobs:
  check-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pushed commits
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Count a push that changes nothing in the site as deployed
        id: site
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          echo "site_change=yes" >> "$GITHUB_OUTPUT"
          if ! [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then echo "No previous commit to compare; checking for a build."; exit 0; fi
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git fetch --quiet --no-tags --depth=100 origin "$BEFORE" || { echo "Could not fetch $BEFORE; checking for a build."; exit 0; }
          changed=$(git diff --name-only --no-renames "$BEFORE" "$SHA") || { echo "Could not compare; checking for a build."; exit 0; }
          . scripts/lib/site-change.sh
          if why=$(printf '%s\n' "$changed" | only_non_site_files); then
            echo "Every file changed in this push is outside the site; Vercel skips its build, so nothing to check:"
            printf '%s\n' "$changed" | sed 's/^/  /'
            echo "site_change=no" >> "$GITHUB_OUTPUT"
          else
            echo "$why; checking for a build."
          fi

      - name: Wait 5 minutes for Vercel to start the build
        if: steps.site.outputs.site_change != 'no'
        run: sleep 300

      - name: Deploy through the hook if Vercel never started a build for this commit
        if: steps.site.outputs.site_change != 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          n=$(gh api "repos/$REPO/deployments?sha=$SHA&per_page=5" -q 'length')
          echo "GitHub deployments for $SHA: $n"
          if [ "$n" -gt 0 ]; then echo "Vercel started a build for this commit; nothing to do."; exit 0; fi
          head=$(gh api "repos/$REPO/commits/main" -q .sha)
          if [ "$head" != "$SHA" ]; then echo "main has moved on to $head; that push has its own check."; exit 0; fi
          if [ -z "$HOOK" ]; then echo "::error::No Vercel build for $SHA after 5 minutes, and VERCEL_DEPLOY_HOOK is not set"; exit 1; fi
          code=$(curl -sS -o /tmp/hook.json -w "%{http_code}" -X POST "$HOOK")
          echo "::warning::No Vercel build for $SHA after 5 minutes; deploy hook called (HTTP $code)"
          cat /tmp/hook.json
          [ "$code" = "200" ] || [ "$code" = "201" ] || exit 1
