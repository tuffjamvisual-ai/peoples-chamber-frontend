name: Daily Data Sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://nwnsvnbudmfkhhwcjwwr.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53bnN2bmJ1ZG1ma2hod2Nqd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQyMTI5NzUsImV4cCI6MjA1OTc4ODk3NX0.yaJwVht69eri_00gOKNhpata1iqZJTZNYdNiN_hLZC8
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      
      - name: Install dependencies
        run: npm install @anthropic-ai/sdk @supabase/supabase-js csv-parse playwright ws
      
      - name: Sync bills (incremental)
        run: node sync-bills-incremental.js

      - name: Match bill divisions
        run: node scripts/sync-bill-divisions.js
      
      # Bill explanations (generate-ai-explanations.js) switched off 14 Oct 2026 by the site
      # owner: the Anthropic API is no longer used. Explanations already written stay on the
      # site. Restore only with a new ANTHROPIC_API_KEY secret.

      - name: Download MP voting data (Sundays only)
        if: github.event.schedule == '0 2 * * 0'
        run: node download-all-divisions-fixed.js
