name: Daily Data Sync

on:
  schedule:
    # 02:23 UTC: GitHub delays scheduled runs most at the top of the hour (runs set for 02:00 started 06:28 to
    # 07:13 in Oct 2026). It still promises no start time.
    - cron: '23 2 * * *'
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest
    # A normal run takes under 10 minutes. 60 (above the steps' own limits, 44 minutes in all) stops a hung run
    # long before GitHub's 6-hour limit; the report step still runs (if: always()) and fails the run, so GitHub
    # emails the owner.
    timeout-minutes: 60
    env:
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://nwnsvnbudmfkhhwcjwwr.supabase.co
      # No anon key here: the one written in was no longer valid, and every step uses the service role key.
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      
      - name: Install dependencies
        run: npm install @anthropic-ai/sdk @supabase/supabase-js csv-parse playwright ws
      
      # Only bills Parliament changed since our newest saved update (about 1 minute). The full repair of every
      # bill runs on Sundays in bills-full-repair.yml.
      - name: Sync bills (incremental)
        id: bills
        timeout-minutes: 20
        run: node sync-bills-incremental.js --write
        continue-on-error: true

      # A step that fails or hits its time limit does not stop the steps after it; the report step lists it and
      # fails the run.
      - name: Match bill divisions
        id: bill-divisions
        timeout-minutes: 15
        continue-on-error: true
        run: node scripts/sync-bill-divisions.js

      # Session names and dates for the bill archive (/bills/sessions), from Parliament's calendar API. One request;
      # upserts, so a new session is named the day its first bill is synced.
      - name: Load parliamentary sessions
        id: parliament-sessions
        timeout-minutes: 5
        continue-on-error: true
        run: node scripts/load-parliament-sessions.js --write
      
      # Rebuild /bills and the session archive now rather than within 10 minutes of the next visit
      # (app/api/revalidate-bills, owner's approval 21 Oct 2026). Needs the site's CRON_SECRET as a repository
      # secret; until it is added the step says so and does nothing.
      - name: Refresh the bill pages
        id: revalidate-bills
        if: steps.bills.outcome == 'success'
        timeout-minutes: 2
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::notice::CRON_SECRET is not a repository secret yet; /bills refreshes within 10 minutes instead."; exit 0; fi
          code=$(curl -sS -o /tmp/revalidate.json -w "%{http_code}" -X POST -H "Authorization: Bearer $CRON_SECRET" https://www.opengovt.uk/api/revalidate-bills)
          # Vercel's bot protection may challenge a request from a cloud runner (403/429): not a failure, the pages
          # still refresh within 10 minutes. Anything else that is not 200 fails the step.
          if [ "$code" = "403" ] || [ "$code" = "429" ]; then echo "::warning::bill page refresh was challenged (HTTP $code); /bills refreshes within 10 minutes instead."; exit 0; fi
          if [ "$code" != "200" ]; then echo "bill page refresh failed: HTTP $code"; cat /tmp/revalidate.json; exit 1; fi
          cat /tmp/revalidate.json

      # Bill explanations (generate-ai-explanations.js) switched off 14 Oct 2026 by the site
      # owner: the Anthropic API is no longer used. Explanations already written stay on the
      # site. Restore only with a new ANTHROPIC_API_KEY secret.

      # "Download MP voting data (Sundays only)" (download-all-divisions-fixed.js) removed
      # 15 Oct 2026: its condition never matched the daily schedule, so it never ran, and its
      # rough title matching duplicated "Match bill divisions" above.
      - name: Report step results (fails the run if any step failed, so GitHub emails the owner)
        if: always()
        timeout-minutes: 2
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: node scripts/report-workflow-steps.js
