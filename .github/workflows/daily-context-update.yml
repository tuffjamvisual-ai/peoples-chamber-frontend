name: Daily Department Updates

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-departments:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://nwnsvnbudmfkhhwcjwwr.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53bnN2bmJ1ZG1ma2hod2Nqd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQyMTI5NzUsImV4cCI6MjA1OTc4ODk3NX0.yaJwVht69eri_00gOKNhpata1iqZJTZNYdNiN_hLZC8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm install @anthropic-ai/sdk @supabase/supabase-js csv-parse playwright ws
      - name: Install Playwright Chromium
        # Use the project's own playwright package (the one the scripts require), so the
        # browser build matches it; npx could pick @playwright/test's older CLI instead.
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Install PostgreSQL client (for psql backfills)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # GOV.UK department data, agency data, ministers' meetings and hospitality, revolving door
      # (ACOBA) and GOV.UK press releases moved to Vercel cron routes on 15 May 2026 (commit
      # ffa3e30: app/api/sync-govuk-data, sync-agency-cache, sync-ministers-meetings,
      # sync-ministers-hospitality, sync-revolving-door, sync-press-releases). Their old script
      # steps were removed from here on 13 Oct 2026: the scripts no longer exist, and the
      # agency step (which had no continue-on-error) stopped every later step from running.
      # The Register of Consultant Lobbyists step was also removed: its script does not exist
      # and there is no route for it yet (to be restored separately).
      - name: Backfill ministerial salary bands (preserves the dept_ministers.salary_band column that sync-govuk-data wipes via delete+insert)
        id: minister-salary-bands
        env:
          DATABASE_URL_RAW: ${{ secrets.DATABASE_URL }}
        run: |
          export DATABASE_URL="$(printf '%s' "$DATABASE_URL_RAW" | tr -d '[:space:]')"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/backfill-dept-ministers-bands.sql
        continue-on-error: true
      # Department context (generate-department-contexts.js) and ministers' meetings
      # organisation descriptions (enrich-ministers-meetings.js) switched off 14 Oct 2026 by
      # the site owner: the Anthropic API is no longer used. Text already written stays on
      # the site. The scripts are kept; restore only with a new ANTHROPIC_API_KEY secret.
      # One job per table (15 Oct 2026). APPGs are refreshed by the Vercel route
      # /api/sync-appgs (weekly, Mondays) and government contracts by /api/sync-government-contracts
      # (daily 03:00, the version that upserts on the contract's own identifiers). The older
      # script copies of both ran here as well and wrote the same tables a second time (the
      # contracts script without the fix against duplicate rows), so those steps were removed.
      - name: Sync committee proceedings (Playwright)
        id: committee-proceedings
        run: node scripts/sync-committee-proceedings.js
        continue-on-error: true
      # "Sync MP division votes" (scripts/sync-mp-votes.js) removed 15 Oct 2026: every insert
      # failed (its ON CONFLICT target matches no constraint), and its rows would have counted
      # tellers as voters and left division_date_only, division_number and party empty. New
      # Commons votes come from the Vercel route /api/sync-commons-votes-api (daily 09:00 UTC),
      # which also saves official totals, each MP's party on the day and the rebellion flags.
      # Companies House step removed 13 Oct 2026: the Companies House section was switched
      # off on 3 June and nothing on the site reads companies_house; the script took the top
      # search result with no check it was the same company (e.g. "News UK" matched to an
      # unrelated firm), and its ~380 rate-limited lookups made this job run for over half an
      # hour. The table is kept. Restore only with matching on company numbers.
      # Political news with commentary (sync-political-news.js) switched off 14 Oct 2026 by
      # the site owner: the Anthropic API is no longer used, and the script needs it to run.
      # Stories already stored stay on the site. Restore only with a new ANTHROPIC_API_KEY secret.
      - name: Sync MP registered interests (powers the Interests tab + outside earnings)
        id: mp-interests
        run: node scripts/sync-mp-interests.js
        continue-on-error: true
      - name: Sync IPSA expenses (year-end totals and itemised claims, years worked out from today)
        id: ipsa-expenses
        env:
          DATABASE_URL_RAW: ${{ secrets.DATABASE_URL }}
        run: |
          export DATABASE_URL="$(printf '%s' "$DATABASE_URL_RAW" | tr -d '[:space:]')"
          # IPSA financial years run April to March and are named like 25_26.
          Y=$(date -u +%Y); M=$(date -u +%-m)
          if [ "$M" -ge 4 ]; then S=$Y; else S=$((Y - 1)); fi
          fy() { printf '%02d_%02d' $(( $1 % 100 )) $(( ($1 + 1) % 100 )); }
          CUR=$(fy $S); PREV=$(fy $((S - 1))); PREV2=$(fy $((S - 2)))
          echo "IPSA years: current $CUR, previous $PREV, before that $PREV2"
          # Year-end totals: last two closed years (IPSA publishes them months after the year ends;
          # a year not yet published is skipped by the script).
          node scripts/sync-ipsa-expenses.js $PREV $PREV2
          # Itemised claims: the current year (filling in every two months) and the last one.
          node scripts/sync-ipsa-expenses-detail.js $CUR $PREV
        continue-on-error: true
      # Every current MP's register in one run (the Vercel route did 150 MPs per call and its
      # follow-on calls stopped on 14 July 2026, leaving ~500 MPs' registers out of date).
      - name: Refresh every MP's register of interests (Members API, powers the Interests tab, second jobs and donations)
        id: registered-interests
        run: node scripts/sync-registered-interests.js --write
        continue-on-error: true
      - name: Recompute outside-earnings summary (depends on mp_registered_interests)
        id: outside-earnings
        env:
          DATABASE_URL_RAW: ${{ secrets.DATABASE_URL }}
        run: |
          export DATABASE_URL="$(printf '%s' "$DATABASE_URL_RAW" | tr -d '[:space:]')"
          # One transaction: the table is never left empty if the rebuild fails. Current register
          # entries only (is_current), so ended roles and old payments are not counted.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          DELETE FROM mp_outside_earnings_summary;
          WITH payments AS (
            SELECT i.member_id, i.id AS parent_row_id,
              substring(c->>'interest' FROM 'Payment:\s*£([0-9][0-9,]*(?:\.[0-9]+)?)') AS amt_text
            FROM mp_registered_interests i
            CROSS JOIN LATERAL jsonb_array_elements(coalesce(i.child_interests, '[]'::jsonb)) AS c
            WHERE i.category_name = '1. Employment and earnings'
              AND i.is_current
              AND coalesce((c->>'isCorrection')::boolean, false) = false
          )
          INSERT INTO mp_outside_earnings_summary (member_id, total_extracted, claim_count, source_count, updated_at)
          SELECT member_id,
            SUM(replace(amt_text, ',', '')::numeric),
            COUNT(*) FILTER (WHERE amt_text IS NOT NULL),
            COUNT(DISTINCT parent_row_id) FILTER (WHERE amt_text IS NOT NULL),
            now()
          FROM payments WHERE amt_text IS NOT NULL GROUP BY member_id;
          COMMIT;
          SQL
        continue-on-error: true
      - name: Fill new MPs' constituency codes and latest election results
        id: new-mps
        # New MPs (by-elections) arrive through the daily roster sync without these two fields;
        # both scripts only write where the Parliament data matches the MP's constituency.
        run: |
          node scripts/backfill-mps-constituency-gss.js --live
          node scripts/import-mp-election-results.js --live
        continue-on-error: true
      - name: Rebuild lobbying index and refresh the /lobbying figures
        id: lobbying-index
        # Matches new ministers' meetings to organisations and refreshes the saved figures
        # (lobby_org_rankings, lobby_summary), so "last 12 months" moves on each day.
        # Refuses to write if ministers_meetings looks mid-sync (see the script).
        run: node scripts/build-lobbying-index.js --write
        continue-on-error: true
      - name: Trigger Vercel redeploy
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
      - name: Report step results (fails the run if any step failed, so GitHub emails the owner)
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: node scripts/report-workflow-steps.js
