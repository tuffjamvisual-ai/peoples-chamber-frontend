name: Daily Department Updates

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-departments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install @anthropic-ai/sdk @supabase/supabase-js csv-parse playwright
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Sync GOV.UK department data
        run: node scripts/sync-govuk-data.js
      - name: Update street contexts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-department-contexts.js
      - name: Sync agency data
        run: node scripts/sync-agency-data.js
      - name: Sync ministers' meetings
        run: node scripts/sync-ministers-meetings.js
        continue-on-error: true
      - name: Enrich ministers' meetings (Haiku org descriptions)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/enrich-ministers-meetings.js
        continue-on-error: true
      - name: Sync APPGs
        run: node scripts/sync-appgs.js
        continue-on-error: true
      - name: Sync ministers' hospitality
        run: node scripts/sync-ministers-hospitality.js
        continue-on-error: true
      - name: Sync revolving door (ACOBA)
        run: node scripts/sync-revolving-door.js
        continue-on-error: true
      - name: Sync committee proceedings (Playwright)
        run: node scripts/sync-committee-proceedings.js
        continue-on-error: true
      - name: Sync Register of Consultant Lobbyists (Playwright)
        run: node scripts/sync-lobbyist-register.js
        continue-on-error: true
      - name: Sync political donations
        run: node scripts/sync-political-donations.js
        continue-on-error: true
      - name: Sync government contracts
        run: node scripts/sync-government-contracts.js
        continue-on-error: true
      - name: Trigger Vercel redeploy
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
